<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Market Volume & Price</title>
    <link rel="stylesheet" href="style.css">
    <!-- Script ufficiale TradingView Widget CDN -->
    <script type="text/javascript" src="https://tradingview.com"></script>
</head>
<body>

    <div class="dashboard-container">
        <header class="main-header">
            <div class="logo-area">
                <h1>MARKET VOLUME & PRICE DASHBOARD</h1>
            </div>
            <div class="controls-area">
                <div class="market-selector">
                    <button class="market-btn active" data-market="USA">US USA</button>
                    <button class="market-btn" data-market="ITA">IT ITA</button>
                    <button class="market-btn" data-market="CRYPTO">CRYPTO</button>
                </div>
                <select id="ticker-select" class="ticker-dropdown"></select>
                <button id="fetch-btn" class="action-btn">Aggiorna</button>
            </div>
        </header>

        <!-- Area Grafico Centrale -->
        <div class="chart-price-container">
            <div id="tv-chart-widget" style="width: 100%; height: 100%;"></div>
        </div>

        <!-- Contenitore per affiancare orizzontalmente i due profili -->
        <main class="profiles-wrapper-side">
            <section class="profile-section-side">
                <h2>STORICO COMPLETO <span id="poc-display-full" class="metric-badge"></span> <span id="va-display-full" class="metric-badge va"></span></h2>
                <div id="volume-profile-rows-full" class="volume-profile-container"></div>
            </section>

            <section class="profile-section-side">
                <h2>DAL MASSIMO STORICO AD OGGI <span id="poc-display-ath" class="metric-badge"></span> <span id="va-display-ath" class="metric-badge va"></span></h2>
                <div id="volume-profile-rows-ath" class="volume-profile-container"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
