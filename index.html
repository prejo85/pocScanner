<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Profile Doppia Vista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-dashboard">
        <!-- Barra dei comandi superiore comune -->
        <div class="header-container">
            <div class="header-title">Volume Profile & POC Dashboard</div>
            <div class="controls">
                <input type="text" id="ticker-input" value="BTC" placeholder="Es. AAPL o BTCUSDT">
                <button id="fetch-btn">Aggiorna</button>
            </div>
        </div>

        <!-- Contenitore dei due grafici affiancati -->
        <div class="charts-wrapper">
            
            <!-- GRAFICO 1: STORICO COMPLETO -->
            <div class="volume-profile-container">
                <div class="panel-title">Storico Completo</div>
                <div id="volume-profile-rows-full" class="profile-rows-container">
                    <div class="loading-text">Inserisci un ticker e premi Aggiorna</div>
                </div>
                <div class="footer-info">
                    <div class="poc-text">POC: <span id="poc-display-full">--.--</span></div>
                    <div class="va-text">Value Area (70%): <span id="va-display-full">--.--</span></div>
                </div>
            </div>

            <!-- GRAFICO 2: DAL MASSIMO ASSOLUTO AD OGGI -->
            <div class="volume-profile-container">
                <div class="panel-title">Dal Massimo Storico a Oggi</div>
                <div id="volume-profile-rows-ath" class="profile-rows-container">
                    <div class="loading-text">Inserisci un ticker e premi Aggiorna</div>
                </div>
                <div class="footer-info">
                    <div class="poc-text">POC: <span id="poc-display-ath">--.--</span></div>
                    <div class="va-text">Value Area (70%): <span id="va-display-ath">--.--</span></div>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
